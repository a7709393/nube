<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>書格有物 · 選品型錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --ink:     #1a1714;
  --paper:   #f5f0e8;
  --cream:   #ede8dc;
  --warm:    #c8a96e;
  --rust:    #9b5c3a;
  --sage:    #6b7c6a;
  --mist:    #8a9ba8;
  --ghost:   rgba(26,23,20,0.06);
  --border:  rgba(26,23,20,0.12);

  --cat-top:  #7c6e8a;
  --cat-s:    #5a8a6a;
  --cat-m:    #5a7a9b;
  --cat-ml:   #9b7a3a;
  --cat-xl:   #9b4a3a;
  --cat-unk:  #888;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Serif TC', serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HERO ── */
.hero {
  position: relative;
  padding: 80px 60px 60px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 40px;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 420px; height: 420px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200,169,110,0.15) 0%, transparent 70%);
  pointer-events: none;
}
.hero-brand {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(42px, 6vw, 80px);
  letter-spacing: -0.02em;
  line-height: 1;
  color: var(--ink);
}
.hero-brand span {
  display: block;
  font-size: 0.38em;
  font-style: normal;
  font-weight: 500;
  letter-spacing: 0.22em;
  color: var(--warm);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.hero-meta {
  text-align: right;
}
.hero-count {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--warm);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.hero-tagline {
  font-size: 13px;
  color: rgba(26,23,20,0.5);
  line-height: 1.6;
  font-weight: 300;
}

/* ── TOOLBAR ── */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--paper);
  border-bottom: 1px solid var(--border);
  padding: 0 60px;
  display: flex;
  align-items: center;
  gap: 0;
  backdrop-filter: blur(12px);
}
.filter-tabs {
  display: flex;
  align-items: center;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
  flex: 1;
}
.filter-tabs::-webkit-scrollbar { display: none; }

.tab {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 18px 22px;
  font-size: 12.5px;
  font-weight: 400;
  letter-spacing: 0.05em;
  color: rgba(26,23,20,0.45);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
  font-family: 'Noto Serif TC', serif;
}
.tab:hover { color: var(--ink); }
.tab.active {
  color: var(--ink);
  border-bottom-color: var(--warm);
  font-weight: 600;
}
.tab-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.tab-count {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  background: var(--ghost);
  padding: 1px 6px;
  border-radius: 20px;
}

.search-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0 12px 24px;
  border-left: 1px solid var(--border);
  margin-left: auto;
}
.search-input {
  font-family: 'Noto Serif TC', serif;
  font-size: 12px;
  border: 1px solid var(--border);
  background: var(--cream);
  padding: 7px 14px;
  border-radius: 4px;
  outline: none;
  width: 200px;
  color: var(--ink);
  transition: border-color 0.2s;
}
.search-input::placeholder { color: rgba(26,23,20,0.35); }
.search-input:focus { border-color: var(--warm); }

/* ── GRID ── */
.grid-section {
  padding: 48px 60px 80px;
}
.grid-header {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 32px;
}
.grid-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.grid-subtitle {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: rgba(26,23,20,0.4);
  letter-spacing: 0.08em;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 24px;
}

/* ── CARD ── */
.card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(.22,.68,0,1.2), box-shadow 0.25s;
  display: flex;
  flex-direction: column;
  animation: fadeUp 0.5s both;
}
.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 16px 40px rgba(26,23,20,0.12);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-img-wrap {
  position: relative;
  aspect-ratio: 3/4;
  overflow: hidden;
  background: var(--cream);
}
.card-img-wrap img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.5s cubic-bezier(.22,.68,0,1.2);
  pointer-events: none;
}
.card-cat-badge { pointer-events: none; }
.card-body { pointer-events: none; }
.card:hover .card-img-wrap img { transform: scale(1.06); }

.card-cat-badge {
  position: absolute;
  top: 10px; left: 10px;
  font-family: 'DM Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 0.1em;
  padding: 3px 8px;
  border-radius: 2px;
  color: #fff;
  text-transform: uppercase;
}

.card-body {
  padding: 14px 16px 16px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.card-id {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--warm);
  letter-spacing: 0.1em;
}
.card-name {
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--ink);
}
.card-dim {
  font-size: 11.5px;
  color: rgba(26,23,20,0.5);
  line-height: 1.5;
  font-weight: 300;
}
.card-price {
  margin-top: auto;
  padding-top: 10px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 500;
  color: var(--rust);
  letter-spacing: -0.01em;
}
.card-price small {
  font-size: 12px;
  font-weight: 300;
  color: rgba(26,23,20,0.4);
  margin-left: 2px;
  font-family: 'Noto Serif TC', serif;
}

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(20,18,15,0.85);
  backdrop-filter: blur(8px);
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--paper);
  border-radius: 4px;
  max-width: 880px;
  width: 100%;
  max-height: 90vh;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr 1fr;
  animation: modalIn 0.3s cubic-bezier(.22,.68,0,1.2);
  position: relative;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.93) translateY(20px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-img-panel {
  background: var(--cream);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  min-height: 480px;
}
.modal-img-panel img {
  max-width: 100%;
  max-height: 520px;
  object-fit: contain;
  border-radius: 2px;
}

.modal-info {
  padding: 48px 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  overflow-y: auto;
}
.modal-cat-badge {
  display: inline-flex;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  padding: 4px 10px;
  border-radius: 2px;
  color: #fff;
  text-transform: uppercase;
  align-self: flex-start;
}
.modal-id {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--warm);
  letter-spacing: 0.12em;
}
.modal-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 32px;
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: -0.01em;
}
.modal-divider {
  height: 1px;
  background: var(--border);
}
.modal-spec-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  color: rgba(26,23,20,0.4);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.modal-spec-value {
  font-size: 14px;
  line-height: 1.7;
  font-weight: 300;
  color: var(--ink);
}
.modal-price-wrap {
  margin-top: auto;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.modal-price-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  color: rgba(26,23,20,0.4);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.modal-price {
  font-family: 'Cormorant Garamond', serif;
  font-size: 42px;
  font-weight: 500;
  color: var(--rust);
  letter-spacing: -0.02em;
  line-height: 1;
}
.modal-price small {
  font-size: 18px;
  font-weight: 300;
  color: rgba(26,23,20,0.45);
  font-family: 'Noto Serif TC', serif;
}

.modal-close {
  position: absolute;
  top: 16px; right: 16px;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--ghost);
  border: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--ink);
  transition: background 0.2s;
  line-height: 1;
}
.modal-close:hover { background: var(--cream); }

/* ── EMPTY ── */
.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 80px 20px;
  color: rgba(26,23,20,0.35);
  font-size: 14px;
  font-weight: 300;
}

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--border);
  padding: 28px 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.footer-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  font-style: italic;
  color: var(--warm);
  font-weight: 300;
}
.footer-note {
  font-size: 11px;
  color: rgba(26,23,20,0.35);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.05em;
}

/* ── NO RESULTS ── */
#no-results {
  display: none;
  text-align: center;
  padding: 60px 20px;
  color: rgba(26,23,20,0.4);
  font-size: 14px;
  font-weight: 300;
}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  /* Hero */
  .hero {
    padding: 36px 20px 28px;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }
  .hero-meta { text-align: left; }
  .hero-brand { font-size: clamp(34px, 10vw, 52px); }
  .hero-tagline { font-size: 12px; }

  /* Toolbar */
  .toolbar { padding: 0 12px; }
  .tab { padding: 14px 11px; font-size: 11px; }
  .tab-count { display: none; }
  .search-wrap { display: none; }

  /* Grid */
  .grid-section { padding: 24px 14px 56px; }
  .grid-title { font-size: 22px; }
  .product-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .card-body { padding: 10px 11px 12px; gap: 4px; }
  .card-name { font-size: 12px; }
  .card-dim { font-size: 10.5px; }
  .card-price { font-size: 17px; }
  .card-cat-badge { font-size: 8.5px; padding: 2px 6px; }

  /* Modal — 最主要的修正 */
  .modal {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    max-height: 92vh;
    overflow-y: auto;   /* 整個 modal 可捲動 */
    border-radius: 6px;
  }
  .modal-img-panel {
    min-height: unset;
    height: 72vw;
    max-height: 380px;
    padding: 12px;
  }
  .modal-img-panel img { max-height: 100%; }
  .modal-info {
    padding: 20px 18px 32px;
    overflow-y: unset;
    gap: 12px;
  }
  .modal-spec-label { font-size: 9px; }
  .modal-spec-value { font-size: 12px; line-height: 1.6; }
  .modal-price-wrap {
    margin-top: 16px;  /* 取消 auto，讓價格正常流排 */
  }
  .modal-name { font-size: 24px; }
  .modal-price { font-size: 34px; }
  .modal-close { top: 10px; right: 10px; width: 32px; height: 32px; font-size: 16px; }

  /* Footer */
  footer {
    padding: 20px 20px;
    flex-direction: column;
    gap: 8px;
    text-align: center;
  }
}

/* 超小螢幕 (< 380px) 再縮 */
@media (max-width: 380px) {
  .tab { padding: 13px 8px; font-size: 10px; }
  .product-grid { gap: 10px; }
  .card-name { font-size: 11.5px; }
}
</style>
</head>
<body>

<!-- HERO -->
<header class="hero">
  <div class="hero-brand">
    <span>書格有物</span>
    選品型錄
  </div>
  <div class="hero-meta">
    <div class="hero-count" id="total-count">— / — 件商品</div>
    <div class="hero-tagline">精選收納展示解決方案<br>點擊商品查看詳細規格</div>
  </div>
</header>

<!-- TOOLBAR -->
<nav class="toolbar">
  <div class="filter-tabs" id="filter-tabs">
    <button class="tab active" data-cat="all" onclick="filterCat('all',this)">
      <span class="tab-dot" style="background:#c8a96e"></span>
      全部商品 <span class="tab-count" id="count-all">0</span>
    </button>
    <button class="tab" data-cat="頂天立地" onclick="filterCat('頂天立地',this)">
      <span class="tab-dot" style="background:#7c6e8a"></span>
      頂天立地 <span class="tab-count" id="count-頂天立地">0</span>
    </button>
    <button class="tab" data-cat="小尺寸" onclick="filterCat('小尺寸',this)">
      <span class="tab-dot" style="background:#5a8a6a"></span>
      小尺寸 <span class="tab-count" id="count-小尺寸">0</span>
    </button>
    <button class="tab" data-cat="中尺寸" onclick="filterCat('中尺寸',this)">
      <span class="tab-dot" style="background:#5a7a9b"></span>
      中尺寸 <span class="tab-count" id="count-中尺寸">0</span>
    </button>
    <button class="tab" data-cat="中大尺寸" onclick="filterCat('中大尺寸',this)">
      <span class="tab-dot" style="background:#9b7a3a"></span>
      中大尺寸 <span class="tab-count" id="count-中大尺寸">0</span>
    </button>
    <button class="tab" data-cat="超大尺寸" onclick="filterCat('超大尺寸',this)">
      <span class="tab-dot" style="background:#9b4a3a"></span>
      超大尺寸 <span class="tab-count" id="count-超大尺寸">0</span>
    </button>
    <button class="tab" data-cat="未分類" onclick="filterCat('未分類',this)">
      <span class="tab-dot" style="background:#888"></span>
      其他 <span class="tab-count" id="count-未分類">0</span>
    </button>
  </div>
  <div class="search-wrap">
    <input class="search-input" type="text" placeholder="搜尋商品名稱…" id="search-input" oninput="handleSearch()">
  </div>
</nav>

<!-- GRID -->
<main class="grid-section">
  <div class="grid-header">
    <h2 class="grid-title" id="grid-title">全部商品</h2>
    <span class="grid-subtitle" id="grid-subtitle"></span>
  </div>
  <div class="product-grid" id="product-grid"></div>
  <div id="no-results">找不到符合的商品</div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-img-panel">
      <img id="modal-img" src="" alt="">
    </div>
    <div class="modal-info">
      <div class="modal-id" id="modal-id"></div>
      <h2 class="modal-name" id="modal-name"></h2>
      <div class="modal-divider"></div>
      <div>
        <div class="modal-spec-label">尺寸規格</div>
        <div class="modal-spec-value" id="modal-dim"></div>
      </div>
      <div class="modal-price-wrap">
        <div class="modal-price-label">建議售價</div>
        <div class="modal-price" id="modal-price"></div>
      </div>
    </div>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>
</div>

<footer>
  <div class="footer-brand">書格有物</div>
  <div class="footer-note">建議售價含稅 · 實際售價以報價為準</div>
</footer>

<script>
const CAT_COLOR = {
  '頂天立地': '#7c6e8a',
  '小尺寸':   '#5a8a6a',
  '中尺寸':   '#5a7a9b',
  '中大尺寸': '#9b7a3a',
  '超大尺寸': '#9b4a3a',
  '未分類':   '#888888',
};
const CAT_LABEL = {
  '頂天立地': '頂天立地',
  '小尺寸':   '小尺寸  ≤120cm',
  '中尺寸':   '中尺寸  120–180cm',
  '中大尺寸': '中大尺寸  180–240cm',
  '超大尺寸': '超大尺寸  >240cm',
  '未分類':   '其他',
};

let allProducts = [];

function buildCounts() {
  const counts = {};
  allProducts.forEach(p => counts[p.cat] = (counts[p.cat]||0) + 1);
  document.getElementById('count-all').textContent = allProducts.length;
  Object.entries(counts).forEach(([cat, n]) => {

    if (el) el.textContent = n;
  });
  document.getElementById('total-count').textContent = allProducts.length + ' 件商品';
}

function filtered() {
  return allProducts.filter(p => {
    const catOk = currentCat === 'all' || p.cat === currentCat;
    const qOk   = !currentQ || p.name.includes(currentQ) || p.id.includes(currentQ) || (p.dim||'').includes(currentQ);
    return catOk && qOk;
  });
}

function render() {
  const list = filtered();
  const grid = document.getElementById('product-grid');
  const noRes = document.getElementById('no-results');

  document.getElementById('grid-subtitle').textContent = list.length + ' 件';

  if (!list.length) {
    grid.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  noRes.style.display = 'none';

  grid.innerHTML = list.map((p, i) => {
    const color = CAT_COLOR[p.cat] || '#888';
    const price = p.price ? 'NT$' + p.price.toLocaleString() : '—';
    const delay = Math.min(i * 30, 400);
    return `
    <article class="card" style="animation-delay:${delay}ms" data-idx="${allProducts.indexOf(p)}" role="button" tabindex="0">
      <div class="card-img-wrap">
        <img src="images/${p.img}" alt="${p.name}" loading="lazy">
        <div class="card-cat-badge" style="background:${color}">${p.cat}</div>
      </div>
      <div class="card-body">
        <div class="card-id">${p.id}</div>
        <div class="card-name">${p.name}</div>
        ${p.dim ? `<div class="card-dim">${p.dim.replace(/\s{2,}/g, '<br>')}</div>` : ''}
        <div class="card-price">${price}<small> TWD</small></div>
      </div>
    </article>`;
  }).join('');
}

function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  const titles = {
    'all':    '全部商品',
    '頂天立地': '頂天立地',
    '小尺寸':  '小尺寸（長度 120cm 以內）',
    '中尺寸':  '中尺寸（120–180cm）',
    '中大尺寸':'中大尺寸（180–240cm）',
    '超大尺寸':'超大尺寸（240cm 以上）',
    '未分類':  '其他商品',
  };
  document.getElementById('grid-title').textContent = titles[cat] || cat;
  render();
}

function handleSearch() {
  currentQ = document.getElementById('search-input').value.trim();
  render();
}

function openModal(idx) {
  const p = allProducts[idx];
  const color = CAT_COLOR[p.cat] || '#888';

  document.getElementById('modal-img').src = 'images/' + p.img;
  document.getElementById('modal-img').alt = p.name;
  document.getElementById('modal-id').textContent = p.id;
  document.getElementById('modal-name').textContent = p.name;
  document.getElementById('modal-dim').innerHTML = p.dim
    ? p.dim.replace(/\s{2,}/g, '<br>')
    : '規格請洽詢';
  document.getElementById('modal-price').innerHTML = p.price
    ? 'NT$' + p.price.toLocaleString() + '<small> TWD</small>'
    : '—';

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay') && !e.target.classList.contains('modal-close')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// 用事件委派取代 onclick，iOS Safari 相容性更好
const grid = document.getElementById('product-grid');
function handleCardOpen(e) {
  const card = e.target.closest('[data-idx]');
  if (!card) return;
  openModal(parseInt(card.dataset.idx));
}
grid.addEventListener('click', handleCardOpen);
grid.addEventListener('touchend', function(e) {
  const card = e.target.closest('[data-idx]');
  if (!card) return;
  e.preventDefault();
  openModal(parseInt(card.dataset.idx));
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal({ target: document.getElementById('modal-overlay') });
});
</script>
</body>
</html>
